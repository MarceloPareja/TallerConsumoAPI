services:
  mysql:
    image: mysql:8.0
    container_name: taller_consumo_api_mysql
    environment:
      MYSQL_ROOT_PASSWORD: "12345"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: api_paises
    ports:
      - "3306:3306"
    volumes:
      - taller_consumo_api_mysql_data:/var/lib/mysql
      - ./bd:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p12345"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  taller_consumo_api_mysql_data:
    name: taller_consumo_api_mysql_data
